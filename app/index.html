<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sero Dash</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:#0b1026; color:#fff; font-family:sans-serif;
         display:flex; align-items:center; justify-content:center; }
  #msg { font-size:2.4vw; opacity:.8; text-align:center; padding:4vw; }
</style>
</head>
<body>
  <div id="msg">Loading Sero Dash...</div>
  <script>
    // Small loader. The real dashboard lives in app/hub.html and is fetched
    // straight from GitHub on every launch, so pushed changes show up within
    // a few minutes instead of waiting on the CDN cache.
    var SOURCES = [
      'https://raw.githubusercontent.com/kierjanm/sero-dash/main/app/hub.html',
      'https://cdn.jsdelivr.net/gh/kierjanm/sero-dash@main/app/hub.html'
    ];

    function fail() {
      document.getElementById('msg').textContent =
        'Could not load the dashboard. Check the TV internet connection and reopen.';
    }

    function load(index) {
      if (index >= SOURCES.length) { fail(); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', SOURCES[index] + '?t=' + new Date().getTime(), true);
      xhr.onload = function () {
        if (xhr.status === 200 && xhr.responseText.indexOf('id="grid"') !== -1) {
          document.open();
          document.write(xhr.responseText);
          document.close();
        } else {
          load(index + 1);
        }
      };
      xhr.onerror = function () { load(index + 1); };
      xhr.send();
    }

    load(0);
  </script>
</body>
</html>
